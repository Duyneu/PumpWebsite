name = "voltor-website"
main = "worker/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Workers / Pages Static Assets configuration
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"

[vars]
NODE_ENV = "production"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "voltor-db"
database_id = "d378304b-9979-4977-877c-c5e7bea45c8d"
