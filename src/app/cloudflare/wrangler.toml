# Cloudflare Workers Configuration
# https://developers.cloudflare.com/workers/

name = "voltor-api-proxy"
main = "worker.js"
compatibility_date = "2024-01-01"

# Account info (get from Cloudflare dashboard)
account_id = "YOUR_ACCOUNT_ID"  # Lấy từ: https://dash.cloudflare.com/
workers_dev = true

# Routes (khi deploy production)
# routes = [
#   { pattern = "api.voltor.com/*", zone_name = "voltor.com" }
# ]

# KV Namespaces for caching & rate limiting
[[kv_namespaces]]
binding = "CACHE_KV"
id = "YOUR_CACHE_KV_ID"
preview_id = "YOUR_PREVIEW_CACHE_KV_ID"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "YOUR_RATE_LIMIT_KV_ID"
preview_id = "YOUR_PREVIEW_RATE_LIMIT_KV_ID"

# Environment variables
[env.production]
vars = { ENVIRONMENT = "production" }

[env.staging]
vars = { ENVIRONMENT = "staging" }

# Triggers
[triggers]
crons = []

# Build configuration
[build]
command = ""

# Limits
[limits]
cpu_ms = 50
